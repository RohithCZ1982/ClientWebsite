{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<section class="py-section bg-light min-vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg p-4 p-lg-5">
          <div class="text-center mb-4">
            <div class="brand-icon-lg mx-auto mb-3"><i class="bi bi-hexagon-fill"></i></div>
            <h3 class="fw-700">Create Your Account</h3>
            <p class="text-muted">Join TechCorp's client portal for exclusive resources and support.</p>
          </div>
          <form action="{{ url_for('auth.signup') }}" method="POST" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-600">Full Name *</label>
                <input type="text" name="name" class="form-control" placeholder="John Doe"
                       value="{{ form_data.get('name', '') }}" required />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600">Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="john@example.com"
                       value="{{ form_data.get('email', '') }}" required />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600">Company</label>
                <input type="text" name="company" class="form-control" placeholder="Your Company"
                       value="{{ form_data.get('company', '') }}" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600">Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 000-0000"
                       value="{{ form_data.get('phone', '') }}" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600">Password *</label>
                <div class="input-group">
                  <input type="password" name="password" class="form-control" id="pwd" placeholder="Min. 8 characters" required />
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('pwd')"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600">Confirm Password *</label>
                <div class="input-group">
                  <input type="password" name="confirm_password" class="form-control" id="pwd2" placeholder="Repeat password" required />
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('pwd2')"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="termsCheck" required />
                  <label class="form-check-label text-muted small" for="termsCheck">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                  </label>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                  <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
              </div>
            </div>
          </form>
          <div class="text-center mt-4">
            <p class="text-muted small">Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-600">Sign In</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
function togglePwd(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
