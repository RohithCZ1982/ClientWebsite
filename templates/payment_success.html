{% extends "base.html" %}
{% block title %}Payment Successful{% endblock %}
{% block content %}
<section class="py-section bg-light min-vh-100 d-flex align-items-center">
  <div class="container text-center">
    <div class="success-icon mb-4"><i class="bi bi-check-circle-fill text-success" style="font-size:5rem;"></i></div>
    <h2 class="fw-800 text-success mb-3">Payment Successful!</h2>
    <p class="lead text-muted mb-5">Thank you for choosing TechCorp Solutions. Your subscription is now active. A confirmation email will be sent to you shortly.</p>
    <div class="d-flex flex-wrap gap-3 justify-content-center">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-5">Go to Home</a>
      <a href="{{ url_for('contact.contact_page') }}" class="btn btn-outline-primary btn-lg px-5">Contact Support</a>
    </div>
  </div>
</section>
{% endblock %}
