{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<section class="py-section bg-light min-vh-100 d-flex align-items-center">
  <div class="container text-center">
    <div class="display-1 fw-800 text-primary mb-3">404</div>
    <h2 class="fw-700 mb-3">Page Not Found</h2>
    <p class="text-muted mb-5">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex flex-wrap justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-5">Go to Home</a>
      <a href="{{ url_for('contact.contact_page') }}" class="btn btn-outline-primary btn-lg px-5">Contact Support</a>
    </div>
  </div>
</section>
{% endblock %}
