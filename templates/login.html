{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<section class="py-section bg-light min-vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg p-4 p-lg-5">
          <div class="text-center mb-4">
            <div class="brand-icon-lg mx-auto mb-3"><i class="bi bi-hexagon-fill"></i></div>
            <h3 class="fw-700">Welcome Back</h3>
            <p class="text-muted">Sign in to your TechCorp account.</p>
          </div>
          <form action="{{ url_for('auth.login') }}" method="POST" novalidate>
            <div class="mb-3">
              <label class="form-label fw-600">Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="john@example.com" required autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label fw-600">Password</label>
              <div class="input-group">
                <input type="password" name="password" class="form-control" id="loginPwd" placeholder="Your password" required />
                <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" />
                <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-primary small fw-600">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          <div class="text-center mt-4">
            <p class="text-muted small">Don't have an account? <a href="{{ url_for('auth.signup') }}" class="fw-600">Create one</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
function togglePwd() {
  const el = document.getElementById('loginPwd');
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
