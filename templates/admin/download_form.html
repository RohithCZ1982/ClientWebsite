{% extends "admin/base.html" %}
{% block title %}Upload File{% endblock %}
{% block page_title %}Upload Resource{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm p-4">
      <form action="{{ url_for('admin.download_new') }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label fw-600">Title *</label>
          <input type="text" name="title" class="form-control" placeholder="Resource title" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Description</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Brief description of this resource..."></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Category</label>
          <select name="category" class="form-select">
            {% for cat in ['General', 'Brochures', 'Guides', 'Templates', 'Case Studies', 'Whitepapers'] %}
            <option>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">File *</label>
          <input type="file" name="file" class="form-control" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.png,.jpg" required />
          <div class="form-text">Allowed: PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, ZIP, PNG, JPG (max 16MB)</div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="is_public" id="publicCheck" checked />
          <label class="form-check-label fw-600" for="publicCheck">Make publicly available</label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload me-1"></i>Upload</button>
          <a href="{{ url_for('admin.downloads_list') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
